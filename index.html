function drawRibbon(t){

      const angle=u*TAU;
      const loopX=side*(34-34*Math.cos(angle));
      const loopY=-78-50*Math.sin(angle)-u*5;
      const looseX=side*(u*210);
      const looseY=-82+Math.sin(u*5+t*2)*u*12+untie*20;
      const x=loopX+(looseX-loopX)*untie;

      for(let w=-2;w<=2;w++){
        symbol(x,y+w*1.6,244-w*9,192-w*9,112-w*7,fade*.85,'=');
      }
    }
    for(let u=0;u<1;u+=.015){
      const x=side*(9+u*35+untie*u*155);
      const y=-75+u*(94-untie*65)+Math.sin(u*4)*8;
      symbol(x,y,231,173,88,fade*.8,'#');
      symbol(x+2,y,255,207,130,fade*.8,'+');
    }
  }
  const knot=1-smooth((t-2.4)/.7);
  for(let y=-85;y<-69;y+=3){
    for(let x=-10;x<=10;x+=3)symbol(x,y,255,203,118,knot,'#');

}

    const glow=(.5+.5*Math.sin(t*star.speed+star.phase))**10;
    ctx.fillStyle='rgba(255,214,200,'+(.06+glow*.7)+')';
    ctx.fillRect(star.x,star.y,1,1);
    if(glow>.45){
      ctx.fillStyle='rgba(255,226,211,'+(glow*.65)+')';
      ctx.fillRect(star.x-star.size*2,star.y-.35,star.size*4,.7);
      ctx.fillRect(star.x-.35,star.y-star.size*3,.7,star.size*6);
    }
  }
  const appear=smooth(t/.9);
  if(t<4.15){
    ctx.save();
    ctx.globalAlpha=appear;
    ctx.translate(0,(1-appear)*15);
    for(let i=0;i<gift.length;i++){
      const p=gift[i];
      symbol(p.x,p.y,p.r,p.g,p.b,.88,chars[i%chars.length]);
    }
    drawLid(t);
    drawRibbon(t);
    ctx.restore();
  }else if(t>=7.4){
    drawKitty(t,false);
    ctx.drawImage(portrait,-182,-182,364,364);
    drawKitty(t,true);
  }else{
    ctx.font='bold 3.9px ui-monospace,Consolas,monospace';
    for(const p of particles){
      const progress=smooth((t-4.1-p.morphDelay)/2.15);
      const arc=Math.sin(progress*Math.PI);
      const x=p.gift.x+(p.x-p.gift.x)*progress+arc*Math.sin(p.phase)*24;
      const y=p.gift.y+(p.y-p.gift.y)*progress-arc*25;
      const r=p.gift.r+(p.r-p.gift.r)*progress;
      const g=p.gift.g+(p.g-p.gift.g)*progress;
      const b=p.gift.b+(p.b-p.gift.b)*progress;
      const alpha=1;
      symbol(x,y,r,g,b,alpha,p.glyph);
    }
    if(t<5)drawLid(t);
  }
  const burst=t-4.2;
  if(burst>0&&burst<4){
    const fade=smooth(burst*3)*(1-smooth((burst-1.5)/2.5));
    for(const p of confetti){
      const x=Math.cos(p.angle)*p.speed*burst;
      const y=-40+Math.sin(p.angle)*p.speed*burst+19*burst*burst;
      ctx.fillStyle='hsla('+p.hue+',80%,78%,'+fade*.8+')';
      ctx.fillText(p.glyph,x,y);
    }
  }
  ctx.restore();
  if(!reduced.matches)frame=requestAnimationFrame(draw);
}
function replay(){
  cancelAnimationFrame(frame);
  start=performance.now();
  frame=requestAnimationFrame(draw);
}
window.addEventListener('resize',()=>{
  resize();
  if(reduced.matches)draw(performance.now());
});
reduced.addEventListener('change',replay);
document.querySelector('button').addEventListener('click',replay);
resize();replay();
</script>
</html>
